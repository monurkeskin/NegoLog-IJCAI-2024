name: Documentation

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  build:
    name: Build current API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs-source/requirements.txt
      - name: Install documentation environment
        run: python -m pip install -r requirements.txt -r docs-source/requirements.txt
      - name: Build
        run: python -m sphinx -W --keep-going -b html docs-source "${{ runner.temp }}/negolog-docs-html"
      - name: Upload documentation for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: negolog-api-documentation
          path: ${{ runner.temp }}/negolog-docs-html
          if-no-files-found: error
          retention-days: 7
